function pCal(){const t=VT(),d=t.cal;const st=S.cal=S.cal||{x:40,y:250,r:-40,ok:false};
  const PUMA="M-32 6 C-36 -2 -28 -12 -18 -14 L-14 -27 L-6 -16 L2 -25 L6 -12 C20 -10 34 -4 50 -6 C110 -14 170 -10 228 4 C262 12 300 30 330 60 C350 80 362 92 373 97 C371 105 352 98 338 86 C312 62 282 42 254 34 C250 48 254 66 260 86 L247 89 C239 71 233 57 227 47 C215 55 205 57 195 55 C197 70 201 80 205 90 L192 93 C184 79 180 67 178 55 C140 59 100 57 72 51 C72 67 74 79 78 91 L65 93 C59 79 57 65 57 51 C49 61 45 75 45 89 L32 89 C32 73 34 59 32 45 C22 37 12 27 6 23 C-2 23 -12 21 -22 17 Z M-17 -5 a2.4 2.4 0 1 0 0.1 0";
  sheet(`<div class="page L"><div class="folio"><span>${t.pF[0]}</span><span>${t.pF[1]} · C</span></div><h2 class="ptitle">${d.t}</h2><p class="hand" style="font-size:20px">${d.task}</p>
    <div class="calwrap"><svg viewBox="0 0 520 400" id="calSvg"><rect width="520" height="400" fill="#e8dfc6"/>
     <g opacity=".55" stroke="#b9a882">${Array.from({length:13},(_,i)=>`<path d="M${i*40} 0 V400"/>`).join('')}${Array.from({length:10},(_,i)=>`<path d="M0 ${i*40} H520"/>`).join('')}</g>
     <path d="M20 40 C80 80 120 140 200 190 C280 240 360 280 420 320" stroke="#5b7fa0" stroke-width="5" fill="none" stroke-linecap="round"/>
     <path d="M330 20 C350 100 360 170 380 230 C395 270 405 300 420 320" stroke="#5b7fa0" stroke-width="5" fill="none" stroke-linecap="round"/>
     <path d="M420 320 C450 345 480 360 515 372" stroke="#5b7fa0" stroke-width="6" fill="none"/>
     <text x="70" y="78" font-size="12" font-style="italic" fill="#3e5f80" font-family="EB Garamond,serif">${d.map.r1}</text><text x="352" y="70" font-size="12" font-style="italic" fill="#3e5f80" font-family="EB Garamond,serif">${d.map.r2}</text>
     <path d="M80 60 l15 18 l12 -10 l15 18 l12 -10 l15 18 l12 -10 l15 18" stroke="#6b4a2a" stroke-width="2.5" fill="none" transform="translate(-20,10)"/>
     <circle cx="110" cy="90" r="34" fill="none" stroke="#6b4a2a" stroke-dasharray="3 4"/><text x="110" y="142" text-anchor="middle" font-size="12" fill="#3b2a1e" font-family="EB Garamond,serif">${d.map.hill}</text>
     <rect x="250" y="200" width="70" height="44" fill="#d9ccaa" stroke="#6b4a2a" stroke-width="1.5"/><text x="285" y="262" text-anchor="middle" font-size="12" fill="#3b2a1e" font-family="EB Garamond,serif">${d.map.plaza}</text>
     <circle cx="420" cy="320" r="7" fill="#8a3b22"/><text x="410" y="345" text-anchor="end" font-size="12" fill="#3b2a1e" font-family="EB Garamond,serif">${d.map.conf}</text>
     <g id="calq" style="cursor:grab"><rect x="-60" y="-50" width="470" height="180" fill="rgba(246,244,236,.5)" stroke="#9a8a6a" stroke-width="1.5"/><path d="${PUMA}" fill="rgba(138,59,34,.12)" stroke="#8a3b22" stroke-width="2.4"/></g>
    </svg></div>
    <div class="calbtns"><button class="lbl" id="cL">↺ ${d.rot}</button><button class="lbl" id="cR">${d.rot} ↻</button></div></div>
   <div class="page R"><div class="folio"><span>Cusco</span><span>${d.map.conf}</span></div><h2 class="ptitle">${d.t}<small>${d.s}</small></h2><p class="body" id="cMsg"></p>
    <figure class="engr" style="width:78%;align-self:center"><img src="img/squier-vue.jpg" alt=""><div class="cap">E. G. Squier, 1877</div></figure></div>`);
  const g=$('#calq'),svg=$('#calSvg');const place=()=>g.setAttribute('transform',`translate(${st.x},${st.y}) rotate(${st.r})`);place();
  const check=()=>{if(st.ok)return;const a=st.r*Math.PI/180,T=[373*Math.cos(a)-97*Math.sin(a)+st.x,373*Math.sin(a)+97*Math.cos(a)+st.y];
    const dh=Math.hypot(st.x-110,st.y-90),dt=Math.hypot(T[0]-420,T[1]-320);if(dh<34&&dt<40){st.ok=true;st.x=110;st.y=90;st.r=20;place();$('#cMsg').textContent=d.ok;solve('cal',[0,10,0]);S.wonder=(S.wonder||0)+15;chrome();}};
  $('#cL').onclick=()=>{if(st.ok)return;st.r-=10;play('pick');place();check();};$('#cR').onclick=()=>{if(st.ok)return;st.r+=10;play('pick');place();check();};
  let drag=null;const pt=ev=>{const r=svg.getBoundingClientRect();return [(ev.clientX-r.left)*520/r.width,(ev.clientY-r.top)*400/r.height];};
  g.addEventListener('pointerdown',ev=>{if(st.ok)return;const p=pt(ev);drag=[p[0]-st.x,p[1]-st.y];g.setPointerCapture(ev.pointerId);g.style.cursor='grabbing';});
  g.addEventListener('pointermove',ev=>{if(!drag)return;const p=pt(ev);st.x=Math.round(p[0]-drag[0]);st.y=Math.round(p[1]-drag[1]);place();});
  g.addEventListener('pointerup',()=>{if(!drag)return;drag=null;g.style.cursor='grab';play('paste');check();});
  if(st.ok)$('#cMsg').textContent=d.ok;}

/* atelier gate: no hammerstone, no strike */
function v2Gate(){const R=$('.spr[data-n="4"] .page.R');if(!R)return;R.querySelector('.gate')?.remove();if(!E.v2||S.items.has('galet'))return;
  const g=document.createElement('div');g.className='gate';g.innerHTML=`<div>${ITEMSVG.galet}<p class="hand" style="font-size:22px">${VT().gate}</p><button class="lbl red">${VT().gateBtn}</button></div>`;
  g.querySelector('button').onclick=()=>goTo(3);R.appendChild(g);}

/* sealed page */
function renderEndV2(){const t=VT(),L=$('.spr[data-n="7"] .page.L'),R=$('.spr[data-n="7"] .page.R');if(!L)return;
  const v=S.verdict,myst=E.claims.find(c=>c.ok==='mystere'),all=E.claims.every(c=>v[c.id]===c.ok);let p='inv';if(!all)p=v[myst.id]!=='mystere'?'sce':'bel';G.done[E.id]=p;
  S.blank=S.blank||[];
  const sent=t.lockTxt.map(s=>{const m=s.match(/^\{(\d)\}$/);if(!m)return esc(s);const i=+m[1],b=t.blanks[i];
    return `<select class="blank${S.hintAt===i?' bad':''}" data-i="${i}" ${S.unlocked?'disabled':''}><option value="">${t.pick}</option>${b.slice(0,3).map((o,j)=>`<option value="${j}" ${S.blank[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}).join('');
  L.innerHTML=`<div class="folio"><span>${t.lockF[0]}</span><span>${t.lockF[1]}</span></div><h2 class="ptitle">${t.lockT}<small>${t.lockS}</small></h2>
    <div class="lockpaper${S.unlocked?' open':''}"><p class="locktxt">${sent}</p>${S.unlocked?`<div class="sig">G. H.</div>`:''}</div>
    <div class="lockbar"><button class="lbl red" id="lChk" ${S.unlocked?'disabled':''}>${t.check}</button><button class="lbl" id="lHint" ${S.unlocked||(S.lockTry||0)<2?'hidden':''}>${t.hint}</button></div>
    <p class="hand" id="lMsg" style="font-size:21px">${S.unlocked?t.unlock:''}</p>
    <div class="tiny" style="margin-top:auto">${t.rep(S.keys.size,S.unlocked)} · ${tr('prof')[p]}</div>${pageno(13)}${prev()}`;
  L.querySelectorAll('select.blank').forEach(s=>s.onchange=()=>{S.blank[+s.dataset.i]=s.value===''?undefined:+s.value;s.classList.remove('bad');if(S.hintAt===+s.dataset.i)S.hintAt=null;play('pencil');});
  $('#lChk').onclick=()=>{const n=t.blanks.length;for(let i=0;i<n;i++)if(S.blank[i]===undefined){$('#lMsg').textContent=t.lockFill;play('nope');return;}
    const bad=t.blanks.map((b,i)=>S.blank[i]===b[3]?-1:i).filter(i=>i>=0);
    if(bad.length){S.lockTry=(S.lockTry||0)+1;S.pen=(S.pen||0)+1;play('nope');$('#lMsg').textContent=t.lockErr(bad.length);$('#lHint').hidden=S.lockTry<2;chrome();return;}
    S.unlocked=true;play('seal');setTimeout(()=>play('fanfare'),600);chrome();renderEndV2();};
  $('#lHint').onclick=()=>{const bad=t.blanks.map((b,i)=>S.blank[i]===b[3]?-1:i).filter(i=>i>=0);if(!bad.length)return;S.hintAt=bad[0];S.pen=(S.pen||0)+2;$('#lMsg').textContent=t.hintTxt;chrome();renderEndV2();};
  const rest=R.querySelector('.v2r');if(rest)rest.remove();const box=document.createElement('div');box.className='v2r';
  box.innerHTML=S.unlocked?`<div class="tiny">${t.unkT}</div><ul class="unk">${t.unk.map(u=>`<li>${u}</li>`).join('')}</ul>
     <div class="ghq"><b>${t.gh}</b> ${t.ghq}</div><div class="tiny">${tr('frag')(E.frag)} · ${t.skyT}</div><p class="fragment" style="font-size:21px">${t.sky}</p>`
    :`<div class="sealbox">${waxSeal()}<p class="hand" style="font-size:22px">${t.sealedR}</p></div>`;
  R.prepend(box);R.querySelectorAll(':scope > .tiny, :scope > .fragment').forEach(x=>x.hidden=true);R.querySelector('.postcard').hidden=!S.unlocked;R.querySelector('.controls').hidden=!S.unlocked;}
